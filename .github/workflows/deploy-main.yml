name: Deploy Prod

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve image tag and public URLs
        id: meta
        env:
          ACCESS_VIA_DOMAIN: ${{ vars.ACCESS_VIA_DOMAIN }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          NGINX_PORT: ${{ vars.NGINX_PORT }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          TAG="${{ vars.IMAGE_TAG }}"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            TAG="$(echo '${{ github.sha }}' | cut -c1-12)"
          fi
          PREFIX="${{ vars.IMAGE_PREFIX }}"
          if [ -z "$PREFIX" ]; then
            PREFIX=ai-sous-chef
          fi
          # shellcheck source=scripts/resolve-public-urls.sh
          source scripts/resolve-public-urls.sh
          {
            echo "tag=${TAG}"
            echo "prefix=${PREFIX}"
            echo "frontend=${PREFIX}-frontend:${TAG}"
            echo "backend=${PREFIX}-backend:${TAG}"
            echo "bot=${PREFIX}-bot:${TAG}"
            echo "nginx_bind=${NGINX_BIND}"
            echo "app_public_url=${APP_PUBLIC_URL}"
            echo "healthcheck_url=${HEALTHCHECK_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Build images on runner
        run: |
          docker build -t "${{ steps.meta.outputs.frontend }}" ./frontend
          docker build -t "${{ steps.meta.outputs.backend }}" ./backend
          docker build -t "${{ steps.meta.outputs.bot }}" ./backend/bot

      - name: Save images
        run: |
          docker save \
            "${{ steps.meta.outputs.frontend }}" \
            "${{ steps.meta.outputs.backend }}" \
            "${{ steps.meta.outputs.bot }}" \
            | gzip > /tmp/ai-sous-chef-images.tar.gz
          ls -lh /tmp/ai-sous-chef-images.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Sync compose + nginx to server
        run: |
          rsync -avz --delete --exclude-from=deploy-rsync-excludes.txt \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PATH }}/"

      - name: Upload images
        run: |
          scp -o StrictHostKeyChecking=no /tmp/ai-sous-chef-images.tar.gz \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PATH }}/ai-sous-chef-images.tar.gz"

      - name: Write .env and start stack
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.prefix }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          NGINX_PORT: ${{ vars.NGINX_PORT }}
          NGINX_BIND: ${{ steps.meta.outputs.nginx_bind }}
          ACCESS_VIA_DOMAIN: ${{ vars.ACCESS_VIA_DOMAIN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_PUBLIC_URL: ${{ steps.meta.outputs.app_public_url }}
          HEALTHCHECK_URL: ${{ steps.meta.outputs.healthcheck_url }}
          DATA_PATH: ${{ vars.DATA_PATH }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_PROXY_URL: ${{ secrets.TG_PROXY_URL }}
          AI_MODE: ${{ vars.AI_MODE }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          : "${POSTGRES_USER:=postgres}"
          : "${POSTGRES_DB:=ai_sous_chef}"
          : "${COMPOSE_PROJECT_NAME:=ai-sous-chef-prod}"
          : "${AI_MODE:=stub}"
          ENV_FILE="$(mktemp)"
          bash scripts/vps-write-deploy-env.sh "$ENV_FILE"
          scp -o StrictHostKeyChecking=no "$ENV_FILE" \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PATH }}/.env"
          rm -f "$ENV_FILE"
          ssh -o StrictHostKeyChecking=no "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" bash << EOF
          set -euo pipefail
          cd "${{ vars.SERVER_PATH }}"
          chmod 600 .env
          gunzip -c ai-sous-chef-images.tar.gz | docker load
          rm -f ai-sous-chef-images.tar.gz
          export COMPOSE_PROJECT_NAME="${{ vars.COMPOSE_PROJECT_NAME }}"
          docker compose \
            -p "\${COMPOSE_PROJECT_NAME}" \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --remove-orphans
          # nginx кэширует IP upstream при старте; после recreate backend/frontend
          # без пересоздания nginx остаётся на старых адресах → 502/503.
          docker compose \
            -p "\${COMPOSE_PROJECT_NAME}" \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --force-recreate --no-deps nginx
          docker image prune -f
          EOF

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ steps.meta.outputs.healthcheck_url }}
        run: |
          url="${HEALTHCHECK_URL}"
          echo "Checking $url"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "$url"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "Health check failed: $url"
            exit 1
          fi
