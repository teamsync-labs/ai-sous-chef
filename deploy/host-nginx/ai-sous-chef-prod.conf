# Хостовый nginx: ai-sous-chef.ru (prod, TLS via Certbot).
# На VPS: /etc/nginx/sites-available/ai-sous-chef-prod.conf → symlink в sites-enabled.
# После правок: nginx -t && systemctl reload nginx
#
# Upstream: compose-nginx на 127.0.0.1:3101 (ACCESS_VIA_DOMAIN=true).
# Cert paths: /etc/letsencrypt/live/ai-sous-chef.ru/

# www → apex
server {
    server_name www.ai-sous-chef.ru;
    return 301 https://ai-sous-chef.ru$request_uri;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-sous-chef.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-sous-chef.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# prod → compose-nginx :3101
server {
    server_name ai-sous-chef.ru;

    client_max_body_size 20m;

    # Путь = $SERVER_PATH/deploy/host-nginx/maintenance.html на VPS
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        alias /var/www/ai-sous-chef/prod/deploy/host-nginx/maintenance.html;
        default_type text/html;
        charset utf-8;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-sous-chef.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-sous-chef.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ai-sous-chef.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ai-sous-chef.ru;
    return 404; # managed by Certbot
}

server {
    if ($host = www.ai-sous-chef.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.ai-sous-chef.ru;
    return 404; # managed by Certbot
}
