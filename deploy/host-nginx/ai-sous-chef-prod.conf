# Хостовый nginx: ai-sous-chef.ru (HTTP bootstrap, до certbot).
# На VPS: /etc/nginx/sites-available/ai-sous-chef-prod.conf → symlink в sites-enabled.
# После правок: nginx -t && systemctl reload nginx
#
# Upstream: compose-nginx на 127.0.0.1:3101 (после ACCESS_VIA_DOMAIN=true).
# До переключения bind compose ещё слушает 0.0.0.0:3101 — proxy на 127.0.0.1 всё равно работает.
#
# TLS: certbot --nginx -d ai-sous-chef.ru -d www.ai-sous-chef.ru
# После certbot — закоммитить получившийся conf обратно в этот файл (или сверить вручную).

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.ai-sous-chef.ru;
    return 301 http://ai-sous-chef.ru$request_uri;
}

# prod → compose-nginx :3101
server {
    listen 80;
    listen [::]:80;
    server_name ai-sous-chef.ru;

    client_max_body_size 20m;

    # Путь = $SERVER_PATH/deploy/host-nginx/maintenance.html на VPS
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        alias /var/www/ai-sous-chef/prod/deploy/host-nginx/maintenance.html;
        default_type text/html;
        charset utf-8;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
