volumes:
  postgres_data:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_KEY_SITE: ${API_KEY_SITE:-local-site-key}
    image: ${IMAGE_PREFIX:-ai-sous-chef}-frontend:${IMAGE_TAG:-latest}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_sous_chef}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE_PREFIX:-ai-sous-chef}-backend:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgresql:5432/ai_sous_chef}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_MODE: ${AI_MODE:-stub}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      CONSENT_JOURNAL_URL: ${CONSENT_JOURNAL_URL:?CONSENT_JOURNAL_URL is required}
      CONSENT_JOURNAL_API_KEY: ${CONSENT_JOURNAL_API_KEY:?CONSENT_JOURNAL_API_KEY is required}
      CONSENT_PUBLIC_BASE: ${CONSENT_PUBLIC_BASE:?CONSENT_PUBLIC_BASE is required}
      API_KEY_BOT: ${API_KEY_BOT:?API_KEY_BOT is required}
      API_KEY_APP: ${API_KEY_APP:?API_KEY_APP is required}
      API_KEY_SITE: ${API_KEY_SITE:?API_KEY_SITE is required}
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bot:
    build:
      context: ./backend/bot
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-ai-sous-chef}-bot:${IMAGE_TAG:-latest}
    environment:
      TG_TOKEN: ${TG_TOKEN:?TG_TOKEN is required}
      TG_PROXY_URL: ${TG_PROXY_URL:?TG_PROXY_URL is required}
      API_BASE: ${API_BASE:-http://backend:8000/app/api}
      CONSENT_PUBLIC_BASE: ${CONSENT_PUBLIC_BASE:?CONSENT_PUBLIC_BASE is required}
      API_KEY_BOT: ${API_KEY_BOT:?API_KEY_BOT is required}
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
